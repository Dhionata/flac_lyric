name: CI/CD Pipeline Semântico

on:
  push:
    branches:
      - master # Executa a cada commit enviado para a branch master

jobs:
  # 1. Validação e Testes (Garante a integridade do código antes de gerar a versão)
  validate-and-test:
    name: Validação & Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      # Otimização de Performance: Configura cache do Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation-action@v3

      - name: Executar Testes Unitários
        run: ./gradlew test

  # 2. Deploy & Release Semântico (Calcula a versão, compila o JAR final e faz o deploy)
  release:
    name: Gerar Versão Semântica & Deploy
    needs: validate-and-test # Só executa se todos os testes passarem
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para criar tags e releases

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para analisar o histórico de commits e calcular o SemVer

      # Calcula a nova versão com base nas mensagens de commit convencionais e cria a tag no GitHub
      - name: Calcular Versão & Criar Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Se o commit não for feat/fix, incrementa a menor versão (patch)
          # Mapeia mensagens do seu prompt para SemVer:
          # fix: -> patch
          # feat: -> minor
          # feat!: ou BREAKING CHANGE: -> major

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compila o JAR final injetando a versão semântica calculada no build.gradle.kts
      - name: Construir JAR com Versão Semântica
        run: ./gradlew jar -Pversion=${{ steps.tag_version.outputs.new_version }}

      # Cria o GitHub Release e anexa o JAR compilado
      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            Nova versão gerada automaticamente baseada nas mensagens de commit.
            
            ### Alterações nesta Versão
            ${{ steps.tag_version.outputs.changelog }}
          draft: false
          prerelease: false
          files: build/libs/*.jar
