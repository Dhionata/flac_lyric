action.0.description=Pairs audio files (.flac) with their lyrics (.lrc), renaming and organizing them in the music folder.
action.0.opt.move_files=Move lyrics to the corresponding music folder
action.0.opt.rename_files=Rename lyrics to match the audio file name
action.1.description=Scans your library and lists all songs that do not yet have a corresponding .lrc file.
action.2.description=Scans the lyrics folder identifying files without timestamp tags ([mm:ss]) and moves them to the output folder.
action.3.description=Removes bulk version markers (such as 'v1:') from the selected .lrc files.
action.4.description=Identifies standalone lyrics (.lrc) without audio in the same folder or library and moves them to a destination folder.
action.5.description=Validates if audio files strictly follow the 'Artist - Title.flac' nomenclature without invalid characters.
action.5.opt.move_files=Move non-standard files to the destination folder
action.6.description=Calculates Fast Fourier Transform (FFT) to check cutoff frequencies and identify 'fake FLAC' files (upscaled from MP3).
action.6.opt.analysis_mode=Spectral Analysis Mode
action.6.opt.move_files=Move identified fake FLACs to the destination folder
action.7.description=Analyzes out-of-order verses, timestamps beyond the end of the song, and generates the report for review in the LRCLIB Comparator.
action.7.opt.move_files=Move problematic lyrics to the destination folder
