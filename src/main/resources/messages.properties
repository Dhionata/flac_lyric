menu.option.0.hint=Associates audio and lyric files (.lrc), moving and renaming the lyrics to the corresponding audio folder.
menu.option.0.title=Organize Music and Lyrics
menu.option.1.hint=Checks the music folder for audio files that do not have a corresponding lyric file.
menu.option.1.title=List audio files without .lrc
menu.option.2.hint=Searches for and lists lyric files that do not have synchronization timestamps.
menu.option.2.title=List unsynced .lrc files
menu.option.3.hint=Cleans lyric files by removing the 'V1:' prefix string that might be incorrectly inserted.
menu.option.3.title=Remove 'V1:' from .lrc files
menu.option.4.hint=Searches for .lrc files that do not have a corresponding audio file, moves them to a folder of your choice, deletes old empty folders, and creates a .txt file listing them.
menu.option.4.title=Find and Move Alone .lrc Files
menu.option.5.hint=Verifies if the audio files follow the structure: Album Artist / Album / Artist - Title (without feat).
menu.option.5.title=Verify Advanced Nomenclature (with Album)
menu.option.6.hint=Analyzes the maximum frequency of the audio to detect cutoff files (fake lossless).
menu.option.6.title=Verify Fake FLACs (Spectrum Analysis)
menu.option.7.hint=Analyzes if lyric (.lrc) files belong to tracks, are synchronized, exceed audio duration, or have conflicting metadata.
menu.option.7.title=Verify Integrity and Sync of .lrc Files
menu.option.8.hint=Opens the interactive web player with album art, seeking, side-by-side comparison (Local vs LRCLIB), and validation buttons.
menu.option.8.title=Compare and Validate Lyrics with LRCLIB (Web Interface)
