action.0.description=Emparelha arquivos de áudio (.flac) com suas letras (.lrc), renomeando e organizando na pasta das músicas.
action.0.opt.move_files=Mover letras para a pasta das músicas correspondentes
action.0.opt.rename_files=Renomear letras para ficarem com o mesmo nome do áudio
action.1.description=Examina sua biblioteca e lista todas as músicas que ainda não possuem arquivo .lrc correspondente.
action.2.description=Varre a pasta de letras identificando arquivos sem tags de timestamp ([mm:ss]) e move para a pasta de saída.
action.3.description=Remove marcações de versão em massa (como 'v1:') dos arquivos .lrc selecionados.
action.4.description=Identifica letras (.lrc) que estão sozinhas (sem áudio na mesma pasta ou biblioteca) e as move para uma pasta de destino.
action.5.description=Valida se os arquivos de áudio seguem rigorosamente a nomenclatura 'Artista - Título.flac' e sem caracteres inválidos.
action.5.opt.move_files=Mover arquivos fora do padrão para a pasta de destino
action.6.description=Calcula a transformada rápida de Fourier (FFT) para verificar frequências de corte e identificar arquivos 'falsos FLAC' (upscaled de MP3).
action.6.opt.analysis_mode=Modo de Análise Espectral
action.6.opt.move_files=Mover falsos FLACs identificados para a pasta de destino
action.7.description=Analisa versos fora de ordem, timestamps além do fim da música e gera o relatório para revisão no Comparador LRCLIB.
action.7.opt.move_files=Mover letras problemáticas para a pasta de destino
