action.6.opt.move_files=Mover falsos FLACs identificados para a pasta de destino
action.7.description=Analisa versos fora de ordem, timestamps além do fim da música, músicas sem letra (.lrc) e gera o relatório para revisão e download no Comparador LRCLIB.
